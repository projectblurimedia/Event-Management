<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17120f" />
    <meta
      name="description"
      content="MS Wedding Planner — premium wedding, catering & event management for weddings, birthdays, housewarmings, engagements, corporate events and family functions."
    />
    <title>MS Wedding Planner | Premium Event Management &amp; Catering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Applies the persisted theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('ms-wedding-planner-ui'));
          var theme = stored && stored.state && stored.state.theme;
          if (theme !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
